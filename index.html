<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>CEEJA Cube — Terra Realista v2.0</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05070a;font-family:Arial,sans-serif;color:white}
#video{position:fixed;inset:0;width:100vw;height:100vh;object-fit:cover;background:#000}
#overlay{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none}
#top{position:fixed;z-index:5;top:12px;left:50%;transform:translateX(-50%);width:min(92vw,480px);
background:rgba(5,8,14,.82);backdrop-filter:blur(7px);padding:12px 14px;border-radius:16px;text-align:center}
#title{font-weight:800;font-size:15px}#status{font-size:12px;margin-top:5px;opacity:.9}
#faces{position:fixed;z-index:5;bottom:15px;left:50%;transform:translateX(-50%);width:min(92vw,480px);
background:rgba(5,8,14,.84);padding:12px;border-radius:16px;text-align:center;font-size:13px;line-height:1.5}
.ok{font-weight:800}.muted{opacity:.65}
#start{margin-top:10px;border:0;border-radius:999px;padding:10px 18px;font-weight:800;font-size:14px}
</style>
<script src="https://unpkg.com/comlink/dist/umd/comlink.js"></script>
<script async src="https://docs.opencv.org/4.x/opencv.js" onload="window._cvLoaded=true"></script>
</head>
<body>
<video id="video" autoplay muted playsinline></video>
<canvas id="overlay"></canvas>
<div id="top"><div id="title">🌍 CEEJA Cube — Terra Realista v2.0</div>
<div id="status">Pronto para iniciar.</div><button id="start">ABRIR CÂMERA</button></div>
<div id="faces"><span class="muted">Nenhuma face detectada ainda.</span></div>
<canvas id="work" width="480" height="360" style="display:none"></canvas>
<img id="earthTexture" crossorigin="anonymous" src="https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg" style="display:none">
<script>
const N={0:"FRENTE",1:"DIREITA",2:"ATRÁS",3:"ESQUERDA",4:"TOPO",5:"BASE"};
const video=document.getElementById("video"), work=document.getElementById("work"),
overlay=document.getElementById("overlay"), statusEl=document.getElementById("status"),
facesEl=document.getElementById("faces"), start=document.getElementById("start");
let detector=null,busy=false,last=[],ready=false;

async function initDetector(){
 statusEl.textContent="Carregando detector AprilTag…";
 try{
   const D=Comlink.wrap(new Worker("./detector-worker.js"));
   detector=await new D(Comlink.proxy(()=>{ready=true;statusEl.textContent="Detector pronto ✓";}));
 }catch(e){statusEl.textContent="Erro ao carregar detector: "+e.message;throw e;}
}
initDetector();

start.onclick=async()=>{
 try{
  const stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:"environment"},width:{ideal:1280},height:{ideal:720}}});
  video.srcObject=stream;await video.play();start.style.display="none";
  statusEl.textContent=ready?"Câmera aberta • procurando tags…":"Câmera aberta • detector carregando…";
  requestAnimationFrame(loop);
 }catch(e){statusEl.textContent="Não foi possível abrir a câmera: "+e.message;}
};

function fit(){
 overlay.width=innerWidth*devicePixelRatio;overlay.height=innerHeight*devicePixelRatio;
 overlay.style.width=innerWidth+"px";overlay.style.height=innerHeight+"px";
}
addEventListener("resize",fit);fit();


let cvReady=false, lastPose=null, lastPoseAt=0, smoothedPose=null;
const FALLBACK_MS=220;
const POS_ALPHA_MULTI=.42, POS_ALPHA_SINGLE=.24;
const ROT_ALPHA_MULTI=.38, ROT_ALPHA_SINGLE=.20;
const MAX_SINGLE_JUMP_M=.055; // rejeita saltos absurdos em transições de 1 face
const MAX_REPROJ_MULTI=8.0, MAX_REPROJ_SINGLE=5.5;
const HALF=.022;          // cube: 44 mm
const TAG_HALF=.01585;     // quadrado preto da AprilTag = 31,7 mm / 2
const EARTH_RADIUS=.060;   // Terra virtual com 12 cm de diâmetro para ocultar melhor o cubo físico

// Cube coordinates: X right, Y up, Z toward FRONT.
// Each array is ordered to match AprilTag detector corners p0,p1,p2,p3.
// This first bundle solver uses the known folded cube geometry.
function getOBJ(){
 const a=TAG_HALF;
 return {
  0:[[-a,-a, HALF],[ a,-a, HALF],[ a, a, HALF],[-a, a, HALF]],
  2:[[ a,-a,-HALF],[-a,-a,-HALF],[-a, a,-HALF],[ a, a,-HALF]],
  1:[[ HALF,-a, a],[ HALF,-a,-a],[ HALF, a,-a],[ HALF, a, a]],
  3:[[-HALF,-a,-a],[-HALF,-a, a],[-HALF, a, a],[-HALF, a,-a]],
  4:[[-a, HALF, a],[ a, HALF, a],[ a, HALF,-a],[-a, HALF,-a]],
  5:[[-a,-HALF,-a],[ a,-HALF,-a],[ a,-HALF, a],[-a,-HALF, a]]
 };
}

async function ensureCV(){
 if(cvReady)return true;
 if(!window._cvLoaded || typeof cv==="undefined")return false;
 if(cv instanceof Promise) cv=await cv;
 cvReady=!!cv.solvePnP;
 return cvReady;
}
function pxy(p){return [p.x,p.y]}

async function solveBundle(ds,W,H){
 if(!(await ensureCV()))return null;
 const obj=getOBJ();
 const good=ds.filter(d=>obj[d.id]&&d.corners&&d.corners.length===4);
 if(!good.length)return null;

 let op=[],ip=[];
 for(const d of good){
   for(let i=0;i<4;i++){op.push(...obj[d.id][i]);ip.push(...pxy(d.corners[i]));}
 }
 const n=ip.length/2;
 const objectPoints=cv.matFromArray(n,1,cv.CV_64FC3,op);
 const imagePoints=cv.matFromArray(n,1,cv.CV_64FC2,ip);

 // Intrínsecos aproximados. Mantemos o FOV da v1.7 para não quebrar a escala já testada.
 const fov=45*Math.PI/180; const fx=(W/2)/Math.tan(fov/2), fy=fx, cx=W/2, cy=H/2;
 const K=cv.matFromArray(3,3,cv.CV_64F,[fx,0,cx, 0,fy,cy, 0,0,1]);
 const dist=cv.Mat.zeros(4,1,cv.CV_64F),rvec=new cv.Mat(),tvec=new cv.Mat();
 let ok=false;
 try{
   // Com 2+ faces usamos todos os cantos como um único corpo rígido.
   // Com 1 face continuamos rastreando para atravessar a troca entre faces.
   ok=cv.solvePnP(objectPoints,imagePoints,K,dist,rvec,tvec,false,cv.SOLVEPNP_ITERATIVE);
 }catch(e){ok=false}
 if(!ok){[objectPoints,imagePoints,K,dist,rvec,tvec].forEach(m=>m.delete());return null}

 const R=new cv.Mat();cv.Rodrigues(rvec,R);
 const out={R:Array.from(R.data64F),t:Array.from(tvec.data64F),fx,fy,cx,cy,n,faces:good.map(x=>x.id),single:good.length===1};
 // erro médio de reprojeção: rejeita soluções instáveis/espelhadas principalmente com 1 face
 let err=0,count=0;
 for(const d of good){
   const pts=obj[d.id];
   for(let i=0;i<4;i++){
     const q=project3(pts[i],out); if(!q) continue;
     const [u,v]=pxy(d.corners[i]); const dx=q[0]-u,dy=q[1]-v;
     err += dx*dx+dy*dy; count++;
   }
 }
 out.reproj=count?Math.sqrt(err/count):999;
 [objectPoints,imagePoints,K,dist,rvec,tvec,R].forEach(m=>m.delete());
 const lim=out.single?MAX_REPROJ_SINGLE:MAX_REPROJ_MULTI;
 return out.reproj<=lim?out:null;
}

function matToQuat(m){
 const tr=m[0]+m[4]+m[8]; let x,y,z,w;
 if(tr>0){const s=Math.sqrt(tr+1.0)*2;w=.25*s;x=(m[7]-m[5])/s;y=(m[2]-m[6])/s;z=(m[3]-m[1])/s;}
 else if(m[0]>m[4]&&m[0]>m[8]){const s=Math.sqrt(1+m[0]-m[4]-m[8])*2;w=(m[7]-m[5])/s;x=.25*s;y=(m[1]+m[3])/s;z=(m[2]+m[6])/s;}
 else if(m[4]>m[8]){const s=Math.sqrt(1+m[4]-m[0]-m[8])*2;w=(m[2]-m[6])/s;x=(m[1]+m[3])/s;y=.25*s;z=(m[5]+m[7])/s;}
 else{const s=Math.sqrt(1+m[8]-m[0]-m[4])*2;w=(m[3]-m[1])/s;x=(m[2]+m[6])/s;y=(m[5]+m[7])/s;z=.25*s;}
 const n=Math.hypot(x,y,z,w)||1;return [x/n,y/n,z/n,w/n];
}
function quatToMat(q){
 const [x,y,z,w]=q,xx=x*x,yy=y*y,zz=z*z,xy=x*y,xz=x*z,yz=y*z,wx=w*x,wy=w*y,wz=w*z;
 return [1-2*(yy+zz),2*(xy-wz),2*(xz+wy),2*(xy+wz),1-2*(xx+zz),2*(yz-wx),2*(xz-wy),2*(yz+wx),1-2*(xx+yy)];
}
function slerp(a,b,t){
 let dot=a[0]*b[0]+a[1]*b[1]+a[2]*b[2]+a[3]*b[3],bb=b.slice();
 if(dot<0){dot=-dot;bb=bb.map(v=>-v)}
 if(dot>.9995){const q=a.map((v,i)=>v+t*(bb[i]-v));const n=Math.hypot(...q)||1;return q.map(v=>v/n)}
 const th=Math.acos(Math.max(-1,Math.min(1,dot))),s=Math.sin(th);
 const u=Math.sin((1-t)*th)/s,v=Math.sin(t*th)/s;return a.map((x,i)=>u*x+v*bb[i]);
}
function poseDistance(a,b){return Math.hypot(a.t[0]-b.t[0],a.t[1]-b.t[1],a.t[2]-b.t[2]);}
function smoothPose(raw){
 if(!smoothedPose){smoothedPose={...raw,R:raw.R.slice(),t:raw.t.slice()};return smoothedPose;}
 // Uma única face é útil na transição, mas não deve conseguir teleportar a Terra.
 if(raw.single && poseDistance(raw,smoothedPose)>MAX_SINGLE_JUMP_M)return smoothedPose;
 const pa=raw.single?POS_ALPHA_SINGLE:POS_ALPHA_MULTI;
 const ra=raw.single?ROT_ALPHA_SINGLE:ROT_ALPHA_MULTI;
 const t=smoothedPose.t.map((v,i)=>v+(raw.t[i]-v)*pa);
 const q0=matToQuat(smoothedPose.R), q1=matToQuat(raw.R), q=slerp(q0,q1,ra);
 smoothedPose={...raw,t,R:quatToMat(q)};
 return smoothedPose;
}
function project3(P,pose){
 const [x,y,z]=P,R=pose.R,t=pose.t;
 const X=R[0]*x+R[1]*y+R[2]*z+t[0],
       Y=R[3]*x+R[4]*y+R[5]*z+t[1],
       Z=R[6]*x+R[7]*y+R[8]*z+t[2];
 if(Z<=.001)return null;
 return [pose.fx*X/Z+pose.cx,pose.fy*Y/Z+pose.cy];
}
function render(ds){
 last=ds.filter(d=>d.id>=0&&d.id<=5);
 if(!last.length){facesEl.innerHTML='<span class="muted">Nenhuma face detectada.</span>';return;}
 facesEl.innerHTML=last.length>=2 ? '<span class="ok">🌍 Rastreamento multiface</span><br><span class="muted">'+last.map(d=>N[d.id]).join(" + ")+'</span>' : '<span class="ok">🌍 Transição por 1 face</span><br><span class="muted">'+last.map(d=>N[d.id]).join(" + ")+'</span>';
}

function drawEarth(ds,sw,sh,pose){
 const ctx=overlay.getContext("2d");ctx.clearRect(0,0,overlay.width,overlay.height);
 if(!pose)return;
 const vw=innerWidth,vh=innerHeight,scale=Math.max(vw/sw,vh/sh);
 const ox=(vw-sw*scale)/2,oy=(vh-sh*scale)/2,dp=devicePixelRatio;
 const S=p=>[ox+p[0]*scale,oy+p[1]*scale];
 const C3=[0,0,0], RADIUS=EARTH_RADIUS;
 const cp=project3(C3,pose), xp=project3([RADIUS,0,0],pose), yp=project3([0,RADIUS,0],pose);
 if(!cp||!xp||!yp)return;
 const C=S(cp), X=S(xp), Y=S(yp);
 const rad=(Math.hypot(X[0]-C[0],X[1]-C[1])+Math.hypot(Y[0]-C[0],Y[1]-C[1]))/2;
 ctx.save();ctx.scale(dp,dp);
 ctx.shadowColor="rgba(70,190,255,.72)";ctx.shadowBlur=20;
 ctx.fillStyle="#0a4c88";ctx.beginPath();ctx.arc(C[0],C[1],rad,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
 const tex=document.getElementById('earthTexture');
 ctx.save();ctx.beginPath();ctx.arc(C[0],C[1],rad*.985,0,Math.PI*2);ctx.clip();
 if(tex && tex.complete && tex.naturalWidth){
   // Same Earth texture used by CEEJA Cube v13. Slow horizontal wrap gives axial rotation.
   const tw=tex.naturalWidth, th=tex.naturalHeight;
   const spin=((performance.now()/28000)%1);
   const sx=spin*tw;
   const d=rad*2;
   ctx.drawImage(tex,sx,0,tw-sx,th,C[0]-rad,C[1]-rad,d*(tw-sx)/tw,d);
   if(sx>0) ctx.drawImage(tex,0,0,sx,th,C[0]-rad+d*(tw-sx)/tw,C[1]-rad,d*sx/tw,d);
 } else {
   const g=ctx.createRadialGradient(C[0]-rad*.3,C[1]-rad*.3,rad*.1,C[0],C[1],rad);
   g.addColorStop(0,'#4da7dd');g.addColorStop(1,'#062d5b');ctx.fillStyle=g;ctx.fillRect(C[0]-rad,C[1]-rad,rad*2,rad*2);
 }
 // subtle spherical lighting to make the flat equirectangular texture read as a globe
 const shade=ctx.createRadialGradient(C[0]-rad*.34,C[1]-rad*.30,rad*.12,C[0]+rad*.20,C[1]+rad*.12,rad*1.05);
 shade.addColorStop(0,'rgba(255,255,255,.20)');shade.addColorStop(.55,'rgba(255,255,255,0)');shade.addColorStop(1,'rgba(0,12,32,.48)');
 ctx.fillStyle=shade;ctx.fillRect(C[0]-rad,C[1]-rad,rad*2,rad*2);
 ctx.restore();
 ctx.strokeStyle="rgba(174,232,255,.90)";ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(C[0],C[1],rad,0,Math.PI*2);ctx.stroke();
 ctx.restore();
}
async function loop(){
 if(video.readyState>=2 && ready && detector && !busy){
  busy=true;
  // Reduced processing resolution keeps the first mobile test light.
  const W=480,H=Math.max(270,Math.round(W*video.videoHeight/video.videoWidth));
  work.width=W;work.height=H;
  const c=work.getContext("2d",{willReadFrequently:true});c.drawImage(video,0,0,W,H);
  const rgba=c.getImageData(0,0,W,H).data, gray=new Uint8Array(W*H);
  for(let i=0,j=0;i<rgba.length;i+=4,j++) gray[j]=(rgba[i]*77+rgba[i+1]*150+rgba[i+2]*29)>>8;
  try{
    const ds=await detector.detect(Comlink.transfer(gray,[gray.buffer]),W,H);
    render(ds);
    const rawPose=await solveBundle(ds,W,H);
    const now=performance.now();
    let pose=null;
    if(rawPose){
      pose=smoothPose(rawPose); lastPose=pose; lastPoseAt=now;
    }else if(lastPose && (now-lastPoseAt)<=FALLBACK_MS){
      pose=lastPose; // pequeno grace period evita piscar durante a troca física de face
    }else if(!ds.length){
      smoothedPose=null;
    }
    drawEarth(ds,W,H,pose);
    if(rawPose){
      statusEl.textContent=(rawPose.single?"Transição suave • 1 face":"Terra ancorada ✓ • "+rawPose.faces.map(id=>N[id]).join(" + "))+" • erro "+rawPose.reproj.toFixed(1)+"px";
    }else if(pose){
      statusEl.textContent="Mantendo última pose…";
    }else{
      statusEl.textContent=ds.length?"Tag detectada • ajustando pose…":"Câmera aberta • procurando o cubo…";
    }
  }catch(e){statusEl.textContent="Detector: "+e.message;}
  busy=false;
 }
 requestAnimationFrame(loop);
}
</script>

</body></html>
