<script>
const N={0:"FRENTE",1:"DIREITA",2:"ATRÁS",3:"ESQUERDA",4:"TOPO",5:"BASE"};
const video=document.getElementById("video"), work=document.getElementById("work"),
overlay=document.getElementById("overlay"), statusEl=document.getElementById("status"),
facesEl=document.getElementById("faces"), start=document.getElementById("start"),
planetLabel=document.getElementById("planetLabel"),
calibEl=document.getElementById("calib"), calibText=document.getElementById("calibText"), calibFill=document.getElementById("calibFill");
let ready=false, busy=false, cvReady=false, cv=null;
let templates=[], lastPose=null, lastPoseAt=0, smoothedPose=null;
let lastMultiPose=null, lastMultiPoseAt=0, lastDrawState=null, lastMultiDrawState=null;
let strongAnchorUntil=0;
let threeReady=false, renderer3d=null, scene3d=null, cam3d=null, anchor3d=null,
content3d=null, earthMesh=null, atmosphereMesh=null, moonPivot=null, moonMesh=null, sunPivot=null, sunLight=null;
let targetPose3d=null, currentPose3d=null, loopsStarted=false;
let srcW=560, srcH=315;
let cameraFovDeg=45, calibSamples=[], calibBusy=false, calibComplete=false, lastCalibSampleAt=0;
let calibFaceCombos=new Set(), calibScaleBuckets=new Set();
const CALIB_KEY="CEEJA_CUBE_CAMERA_FOV_V1";

const FALLBACK_MS=320;
const POS_ALPHA_MULTI=.42, POS_ALPHA_SINGLE=.18;
const ROT_ALPHA_MULTI=.38, ROT_ALPHA_SINGLE=.16;
const MAX_SINGLE_JUMP_M=.055;
const MAX_REPROJ_MULTI=8.0, MAX_REPROJ_SINGLE=5.8;
const MULTI_ANCHOR_MS=2400;
const SINGLE_Z_CLAMP=.005;
const SINGLE_Z_BLEND=.96;
const SINGLE_XY_BLEND=.66;
const SINGLE_SCREEN_RADIUS_STEP=.045;
const SINGLE_SCREEN_CENTER_BLEND=.22;
const MULTI_SCREEN_RADIUS_BLEND=.28;
const MULTI_SCREEN_CENTER_BLEND=.34;
const SINGLE_RADIUS_FROM_MULTI_MIN=.90;
const SINGLE_RADIUS_FROM_MULTI_MAX=1.10;
const MAX_SINGLE_RADIUS_VIEWPORT=.42;
const MAX_MULTI_RADIUS_VIEWPORT=.48;
const HALF=.022;          // cube: 44 mm
const TAG_HALF=.01585;    // marker black square: 31.7 mm / 2
const EARTH_RADIUS=.030;  // 6 cm diameter virtual Earth, calibrado para sensação mais próxima do Merge Cube
const TEMPLATE_SIZE=32;
const MIN_MATCH=0.67;
const MIN_AREA=850;
const MAX_AREA_FRAC=.34;
const DEDUPE_DIST=32;
const DETECT_INTERVAL_MS=55;
const TARGET_LERP_MULTI=.20, TARGET_LERP_SINGLE=.10;
const ROT_LERP_MULTI=.20, ROT_LERP_SINGLE=.10;
const CALIB_MIN_SAMPLES=8, CALIB_TARGET_SAMPLES=12, CALIB_SAMPLE_GAP_MS=500;

function fit(){
 overlay.width=innerWidth*devicePixelRatio;overlay.height=innerHeight*devicePixelRatio;
 overlay.style.width=innerWidth+"px";overlay.style.height=innerHeight+"px";
 if(renderer3d){ renderer3d.setPixelRatio(devicePixelRatio); renderer3d.setSize(innerWidth,innerHeight,false); }
 updateCameraIntrinsics();
}
addEventListener("resize",fit); fit();

function updateCameraIntrinsics(){
 if(!cam3d) return;
 const vw=innerWidth, vh=innerHeight;
 const fovDeg=cameraFovDeg;
 cam3d.fov=fovDeg;
 cam3d.aspect=srcW/srcH;
 cam3d.near=.01; cam3d.far=20;
 cam3d.clearViewOffset();
 const s=Math.max(vw/srcW, vh/srcH);
 const visW=vw/s, visH=vh/s;
 const offX=(srcW-visW)/2, offY=(srcH-visH)/2;
 cam3d.setViewOffset(srcW,srcH,offX,offY,visW,visH);
 cam3d.updateProjectionMatrix();
}

function initThree(){
 if(threeReady) return true;
 if(!window.THREE) throw new Error("Three.js não carregou.");

 renderer3d=new THREE.WebGLRenderer({
   canvas:overlay,
   alpha:true,
   antialias:true,
   powerPreference:"high-performance",
   premultipliedAlpha:true
 });
 renderer3d.setPixelRatio(devicePixelRatio);
 renderer3d.setSize(innerWidth,innerHeight,false);
 renderer3d.setClearColor(0x000000,0);

 scene3d=new THREE.Scene();
 cam3d=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.01,20);
 cam3d.position.set(0,0,0);
 updateCameraIntrinsics();

 const amb=new THREE.AmbientLight(0xd8eeff,1.42);
 scene3d.add(amb);
 const dir=new THREE.DirectionalLight(0xffffff,1.18);
 dir.position.set(.8,.3,.5);
 scene3d.add(dir);

 anchor3d=new THREE.Group();
 anchor3d.visible=false;
 scene3d.add(anchor3d);

 content3d=new THREE.Group();
 content3d.scale.set(EARTH_RADIUS,EARTH_RADIUS,EARTH_RADIUS);
 content3d.position.set(0,0,-0.0015);
 anchor3d.add(content3d);

 const texImg=document.getElementById("earthTexture");
 const earthTex=new THREE.Texture(texImg);
 earthTex.needsUpdate=true;
 if(THREE.SRGBColorSpace) earthTex.colorSpace=THREE.SRGBColorSpace;

 const earthGeo=new THREE.SphereGeometry(1,64,64);
 const earthMat=new THREE.MeshStandardMaterial({
   map:earthTex,
   roughness:.92,
   metalness:0,
   color:0xffffff,
   emissive:0x1a2638,
   emissiveIntensity:.28
 });
 earthMesh=new THREE.Mesh(earthGeo,earthMat);
 content3d.add(earthMesh);

 atmosphereMesh=new THREE.Mesh(
   new THREE.SphereGeometry(1.045,48,48),
   new THREE.MeshBasicMaterial({
     color:0x71d5ff, transparent:true, opacity:.11,
     blending:THREE.AdditiveBlending, side:THREE.BackSide
   })
 );
 content3d.add(atmosphereMesh);

 moonPivot=new THREE.Group();
 moonMesh=new THREE.Mesh(
   new THREE.SphereGeometry(.08,24,24),
   new THREE.MeshStandardMaterial({color:0xd7dbe2, roughness:1, metalness:0})
 );
 moonMesh.position.set(1.18,.05,.08);
 moonPivot.add(moonMesh);
 content3d.add(moonPivot);

 sunPivot=new THREE.Group();
 sunPivot.position.set(1.6,-.72,-.58);
 const sunCore=new THREE.Mesh(
   new THREE.SphereGeometry(.16,24,24),
   new THREE.MeshBasicMaterial({color:0xffd46b, transparent:true, opacity:.98})
 );
 const sunGlow=new THREE.Mesh(
   new THREE.SphereGeometry(.30,24,24),
   new THREE.MeshBasicMaterial({color:0xffb247, transparent:true, opacity:.14, blending:THREE.AdditiveBlending})
 );
 sunPivot.add(sunGlow); sunPivot.add(sunCore);
 content3d.add(sunPivot);

 sunLight=new THREE.PointLight(0xffefbc,1.4,0,2);
 sunLight.position.copy(sunPivot.position);
 content3d.add(sunLight);

 threeReady=true;
 return true;
}

async function waitForCV(){
 if(cvReady && cv) return true;

 statusEl.textContent="Câmera aberta ✓ • baixando motor de visão…";
 try{
   // Pacote moderno feito especificamente para uso do OpenCV.js no navegador.
   const mod = await import("https://esm.run/@opencvjs/web@5.0.0-release.2");
   statusEl.textContent="Câmera aberta ✓ • iniciando motor de visão…";
   cv = await mod.loadOpenCV();

   if(!cv || !cv.Mat || !cv.findContours || !cv.solvePnP){
     throw new Error("O motor carregou, mas faltam funções necessárias.");
   }

   cvReady=true;
   return true;
 }catch(e){
   console.error("OpenCV loader:",e);
   throw new Error("Não foi possível carregar o motor de visão: "+(e?.message||e));
 }
}
async function waitImgs(ids){
 await Promise.all(ids.map(id=>new Promise((resolve,reject)=>{
   const img=document.getElementById(id);
   if(img.complete && img.naturalWidth) return resolve();
   img.onload=()=>resolve(); img.onerror=()=>reject(new Error('Falha ao carregar '+id));
 })));
}
function matToBits(mat){
 const out=new Uint8Array(mat.rows*mat.cols);
 for(let i=0;i<out.length;i++) out[i]=mat.data[i]>127?1:0;
 return out;
}
function rotateBits(bits,size){
 const out=new Uint8Array(bits.length);
 for(let y=0;y<size;y++) for(let x=0;x<size;x++) out[y*size+x]=bits[(size-1-x)*size+y];
 return out;
}
function similarity(a,b){
 let same=0;
 for(let i=0;i<a.length;i++) if(a[i]===b[i]) same++;
 return same/a.length;
}
function rotateCorners(corners,rot){
 const n=corners.length, out=[];
 for(let i=0;i<n;i++) out.push(corners[(i+rot)%n]);
 return out;
}
function orderQuad(pts){
 const p=pts.slice().sort((a,b)=>a.y-b.y);
 const top=p.slice(0,2).sort((a,b)=>a.x-b.x);
 const bot=p.slice(2).sort((a,b)=>a.x-b.x);
 return [top[0],top[1],bot[1],bot[0]]; // tl,tr,br,bl
}
function quadArea(pts){
 let a=0; for(let i=0;i<4;i++){const p=pts[i], q=pts[(i+1)%4]; a += p.x*q.y - q.x*p.y;} return Math.abs(a/2);
}
function centerOf(c){return {x:(c[0].x+c[1].x+c[2].x+c[3].x)/4,y:(c[0].y+c[1].y+c[2].y+c[3].y)/4};}
function dist(a,b){const dx=a.x-b.x, dy=a.y-b.y; return Math.hypot(dx,dy)}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}

function loadSavedCalibration(){try{const raw=localStorage.getItem(CALIB_KEY);if(!raw)return false;const v=JSON.parse(raw);if(v&&Number.isFinite(v.fov)&&v.fov>=30&&v.fov<=85){cameraFovDeg=v.fov;calibComplete=true;updateCameraIntrinsics();return true}}catch(e){}return false}
function resetCalibration(){calibSamples=[];calibFaceCombos=new Set();calibScaleBuckets=new Set();calibComplete=false;calibBusy=false;cameraFovDeg=45;try{localStorage.removeItem(CALIB_KEY)}catch(e){}updateCalibUI();updateCameraIntrinsics()}
function updateCalibUI(){
 if(calibComplete){calibEl.style.display='none';return}
 calibEl.style.display='block';

 const count=calibSamples.length;
 const samplePart=Math.min(1,count/CALIB_TARGET_SAMPLES);
 const comboPart=Math.min(1,calibFaceCombos.size/2);
 const scalePart=Math.min(1,calibScaleBuckets.size/2);

 // A barra agora representa exatamente os três requisitos reais.
 const progress=Math.min(99,Math.round(samplePart*60 + comboPart*20 + scalePart*20));
 calibFill.style.width=progress+'%';

 if(count<3){
   calibText.textContent='Mostre duas faces do cubo ao mesmo tempo e gire devagar…';
 }else if(calibFaceCombos.size<2){
   calibText.textContent='Ótimo. Agora gire para mostrar outra combinação de duas faces…';
 }else if(calibScaleBuckets.size<2){
   calibText.textContent='Agora aproxime ou afaste um pouco o cubo…';
 }else if(count<CALIB_MIN_SAMPLES){
   calibText.textContent='Continue girando devagar… '+progress+'%';
 }else{
   calibText.textContent='Dados suficientes ✓ • ajustando a câmera…';
 }
}
function cloneDetectionSet(ds){return ds.map(d=>({id:d.id,score:d.score,corners:d.corners.map(p=>({x:p.x,y:p.y}))}))}
function maybeCollectCalibration(ds,W,H){
 if(calibComplete||calibBusy) return;

 // Uma face ainda serve para a experiência, mas não entra na AutoCal.
 if(ds.length<2){
   updateCalibUI();
   return;
 }

 const now=performance.now();
 if(now-lastCalibSampleAt<CALIB_SAMPLE_GAP_MS) return;

 const ids=ds.map(d=>d.id).sort((a,b)=>a-b);
 const combo=ids.join('-');

 let avgArea=0;
 for(const d of ds) avgArea+=quadArea(d.corners);
 avgArea/=ds.length;

 const frac=avgArea/(W*H);
 const bucket=frac<.025?'far':(frac<.07?'mid':'near');

 // v4.1: sempre coleta uma nova observação multiface em intervalos regulares.
 // Antes, amostras repetidas eram descartadas e a barra podia ficar presa.
 calibSamples.push({
   ds:cloneDetectionSet(ds),
   W,H,combo,bucket,
   area:frac,
   time:now
 });
 calibFaceCombos.add(combo);
 calibScaleBuckets.add(bucket);
 lastCalibSampleAt=now;

 if(calibSamples.length>CALIB_TARGET_SAMPLES) calibSamples.shift();

 updateCalibUI();

 if(calibSamples.length>=CALIB_MIN_SAMPLES &&
    calibFaceCombos.size>=2 &&
    calibScaleBuckets.size>=2){
   setTimeout(runAutoCalibration,80);
 }
}
function solveSampleAtFov(sample,fovDeg){const obj=getOBJ();const good=sample.ds.filter(d=>obj[d.id]&&d.corners&&d.corners.length===4);if(good.length<2)return 999;let op=[],ip=[];for(const d of good){for(let i=0;i<4;i++){op.push(...obj[d.id][i]);ip.push(d.corners[i].x,d.corners[i].y)}}const n=ip.length/2;const objectPoints=cv.matFromArray(n,1,cv.CV_64FC3,op);const imagePoints=cv.matFromArray(n,1,cv.CV_64FC2,ip);const fov=fovDeg*Math.PI/180;const fx=(sample.W/2)/Math.tan(fov/2),fy=fx,cx=sample.W/2,cy=sample.H/2;const K=cv.matFromArray(3,3,cv.CV_64F,[fx,0,cx,0,fy,cy,0,0,1]);const distm=cv.Mat.zeros(4,1,cv.CV_64F),rvec=new cv.Mat(),tvec=new cv.Mat();let err=999;try{const ok=cv.solvePnP(objectPoints,imagePoints,K,distm,rvec,tvec,false,cv.SOLVEPNP_ITERATIVE);if(ok){const Rm=new cv.Mat();cv.Rodrigues(rvec,Rm);const pose={R:Array.from(Rm.data64F),t:Array.from(tvec.data64F),fx,fy,cx,cy};let sum=0,count=0;for(const d of good){const pts=obj[d.id];for(let i=0;i<4;i++){const q=project3(pts[i],pose);if(!q)continue;const dx=q[0]-d.corners[i].x,dy=q[1]-d.corners[i].y;sum+=dx*dx+dy*dy;count++}}err=count?Math.sqrt(sum/count):999;Rm.delete()}}catch(e){}objectPoints.delete();imagePoints.delete();K.delete();distm.delete();rvec.delete();tvec.delete();return err}
async function runAutoCalibration(){if(calibBusy||calibComplete||calibSamples.length<CALIB_MIN_SAMPLES)return;calibBusy=true;calibText.textContent='Ajustando câmera…';try{const samples=calibSamples.slice(-12);let bestFov=cameraFovDeg,bestErr=Infinity;for(let f=34;f<=74;f+=4){let errs=[];for(const s of samples){const e=solveSampleAtFov(s,f);if(Number.isFinite(e)&&e<40)errs.push(e)}if(errs.length<Math.max(5,Math.floor(samples.length*.6)))continue;errs.sort((a,b)=>a-b);const trimmed=errs.slice(0,Math.max(3,Math.ceil(errs.length*.8)));const mean=trimmed.reduce((a,b)=>a+b,0)/trimmed.length;if(mean<bestErr){bestErr=mean;bestFov=f}await new Promise(r=>setTimeout(r,0))}for(let f=Math.max(30,bestFov-4);f<=Math.min(82,bestFov+4);f+=1){let errs=[];for(const s of samples){const e=solveSampleAtFov(s,f);if(Number.isFinite(e)&&e<40)errs.push(e)}if(errs.length<5)continue;errs.sort((a,b)=>a-b);const trimmed=errs.slice(0,Math.max(3,Math.ceil(errs.length*.8)));const mean=trimmed.reduce((a,b)=>a+b,0)/trimmed.length;if(mean<bestErr){bestErr=mean;bestFov=f}await new Promise(r=>setTimeout(r,0))}if(Number.isFinite(bestErr)&&bestErr<12){cameraFovDeg=bestFov;calibComplete=true;try{localStorage.setItem(CALIB_KEY,JSON.stringify({fov:bestFov,error:bestErr,ts:Date.now()}))}catch(e){}updateCameraIntrinsics();calibFill.style.width='100%';calibText.textContent='Calibração concluída ✓';calibEl.style.display='block';setTimeout(()=>{calibEl.style.display='none'},1400);statusEl.textContent='Câmera calibrada ✓ • FOV '+bestFov.toFixed(0)+'°'}else{calibText.textContent='Ainda falta variedade. Mostre duas faces e mude um pouco a distância…'}}finally{calibBusy=false}}
loadSavedCalibration();updateCalibUI();
async function initDetector(){
 statusEl.textContent="Câmera aberta ✓ • preparando detector…";
 try{
   await waitForCV();
   statusEl.textContent="Motor de visão pronto ✓ • carregando marcadores…";
   await waitImgs(['tpl0','tpl1','tpl2','tpl3','tpl4','tpl5']);
   templates=[];
   for(let id=0; id<6; id++){
     const src=cv.imread(document.getElementById('tpl'+id));
     const gray=new cv.Mat(), bw=new cv.Mat(), small=new cv.Mat();
     cv.cvtColor(src,gray,cv.COLOR_RGBA2GRAY);
     cv.threshold(gray,bw,0,255,cv.THRESH_BINARY+cv.THRESH_OTSU);
     cv.resize(bw,small,new cv.Size(TEMPLATE_SIZE,TEMPLATE_SIZE),0,0,cv.INTER_AREA);
     const rots=[];
     let bits=matToBits(small);
     for(let r=0;r<4;r++){rots.push(bits); bits=rotateBits(bits,TEMPLATE_SIZE);}
     templates.push({id,rots});
     src.delete(); gray.delete(); bw.delete(); small.delete();
   }
   ready=true;
   statusEl.textContent="Detector pronto ✓ • Terra 3D preparada";
   return true;
 }catch(e){
   ready=false;
   statusEl.textContent="Erro ao iniciar detector: "+e.message;
   console.error(e);
   throw e;
 }
}

document.getElementById("title").ondblclick=()=>{resetCalibration();statusEl.textContent="Calibração apagada • gire o cubo novamente";};

start.onclick=async()=>{
 try{
  // 1) Abre a câmera primeiro. O motor de visão só começa depois do clique.
  start.disabled=true;
  start.textContent="ABRINDO CÂMERA…";
  const stream=await navigator.mediaDevices.getUserMedia({
    audio:false,
    video:{facingMode:{ideal:"environment"},width:{ideal:1280},height:{ideal:720}}
  });
  video.srcObject=stream;
  await video.play();

  start.style.display="none";
  statusEl.textContent="Câmera aberta ✓ • iniciando detector…";
  updateCalibUI();

  // 2) Só agora carrega/prepara o detector.
  if(!ready){
    await initDetector();
  }
  if(!threeReady){
    initThree();
  }

  if(ready){
    statusEl.textContent="Detector pronto ✓ • procurando o cubo…";
  }
  if(!loopsStarted){
    loopsStarted=true;
    requestAnimationFrame(renderLoop);
    requestAnimationFrame(loop);
  }
 }catch(e){
  start.disabled=false;
  start.textContent="ABRIR CÂMERA";
  statusEl.textContent="Erro ao iniciar: "+e.message;
 }
};

function getOBJ(){
 const a=TAG_HALF;
 return {
  0:[[-a,-a, HALF],[ a,-a, HALF],[ a, a, HALF],[-a, a, HALF]],
  2:[[ a,-a,-HALF],[-a,-a,-HALF],[-a, a,-HALF],[ a, a,-HALF]],
  1:[[ HALF,-a, a],[ HALF,-a,-a],[ HALF, a,-a],[ HALF, a, a]],
  3:[[-HALF,-a,-a],[-HALF,-a, a],[-HALF, a, a],[-HALF, a,-a]],
  4:[[-a, HALF, a],[ a, HALF, a],[ a, HALF,-a],[-a, HALF,-a]],
  5:[[-a,-HALF,-a],[ a,-HALF,-a],[ a,-HALF, a],[-a,-HALF, a]]
 };
}
function pxy(p){return [p.x,p.y]}

function detectCustom(imageData,W,H){
 if(!cvReady || !templates.length) return [];

 const src=cv.matFromImageData(imageData);
 const gray=new cv.Mat(), blur=new cv.Mat();
 cv.cvtColor(src,gray,cv.COLOR_RGBA2GRAY);
 cv.GaussianBlur(gray,blur,new cv.Size(5,5),0,0,cv.BORDER_DEFAULT);

 // Duas leituras da mesma imagem:
 // 1) Otsu: ótima para contraste normal.
 // 2) Adaptativa: ajuda quando há sombra, inclinação ou iluminação desigual.
 const otsu=new cv.Mat(), adaptive=new cv.Mat();
 cv.threshold(blur,otsu,0,255,cv.THRESH_BINARY_INV+cv.THRESH_OTSU);
 cv.adaptiveThreshold(
   blur,adaptive,255,
   cv.ADAPTIVE_THRESH_GAUSSIAN_C,
   cv.THRESH_BINARY_INV,
   31,7
 );

 const kernel=cv.Mat.ones(3,3,cv.CV_8U);
 const binaries=[otsu,adaptive];
 const candidates=[];
 const maxArea=W*H*MAX_AREA_FRAC;

 function scanBinary(bin){
   const closed=new cv.Mat();
   cv.morphologyEx(bin,closed,cv.MORPH_CLOSE,kernel);

   const contours=new cv.MatVector(), hierarchy=new cv.Mat();
   // RETR_LIST encontra também quadriláteros que ficavam "escondidos"
   // dentro do contorno branco do cubo.
   cv.findContours(closed,contours,hierarchy,cv.RETR_LIST,cv.CHAIN_APPROX_SIMPLE);

   for(let i=0;i<contours.size();i++){
     const cnt=contours.get(i);
     const area=cv.contourArea(cnt);
     if(area<MIN_AREA || area>maxArea){cnt.delete(); continue;}

     const peri=cv.arcLength(cnt,true);
     const approx=new cv.Mat();
     cv.approxPolyDP(cnt,approx,0.04*peri,true);

     if(approx.rows!==4 || !cv.isContourConvex(approx)){
       approx.delete(); cnt.delete(); continue;
     }

     const pts=[];
     for(let j=0;j<4;j++){
       pts.push({x:approx.data32S[j*2], y:approx.data32S[j*2+1]});
     }
     const ord=orderQuad(pts);

     const sideLens=[];
     for(let j=0;j<4;j++){
       const a=ord[j], b=ord[(j+1)%4];
       sideLens.push(Math.hypot(a.x-b.x,a.y-b.y));
     }
     const minSide=Math.min(...sideLens), maxSide=Math.max(...sideLens);
     if(minSide<18 || maxSide/minSide>2.15){
       approx.delete(); cnt.delete(); continue;
     }

     const srcTri=cv.matFromArray(4,1,cv.CV_32FC2,[
       ord[0].x,ord[0].y,
       ord[1].x,ord[1].y,
       ord[2].x,ord[2].y,
       ord[3].x,ord[3].y
     ]);
     const dstTri=cv.matFromArray(4,1,cv.CV_32FC2,[0,0,79,0,79,79,0,79]);
     const M=cv.getPerspectiveTransform(srcTri,dstTri);

     const warp=new cv.Mat(), wb=new cv.Mat(), small=new cv.Mat();
     cv.warpPerspective(
       gray,warp,M,new cv.Size(80,80),
       cv.INTER_LINEAR,cv.BORDER_CONSTANT,
       new cv.Scalar(255,255,255,255)
     );

     // Um pequeno blur antes de binarizar torna a comparação menos sensível
     // a serrilhado, impressão e foco.
     cv.GaussianBlur(warp,warp,new cv.Size(3,3),0,0,cv.BORDER_DEFAULT);
     cv.threshold(warp,wb,0,255,cv.THRESH_BINARY+cv.THRESH_OTSU);
     cv.resize(wb,small,new cv.Size(TEMPLATE_SIZE,TEMPLATE_SIZE),0,0,cv.INTER_AREA);
     cv.threshold(small,small,127,255,cv.THRESH_BINARY);

     const bits=matToBits(small);
     let best={score:-1,id:-1,rot:0};

     for(const tpl of templates){
       for(let r=0;r<4;r++){
         const score=similarity(bits,tpl.rots[r]);
         if(score>best.score) best={score,id:tpl.id,rot:r};
       }
     }

     if(best.score>=MIN_MATCH){
       const canon=rotateCorners(ord,best.rot);
       candidates.push({
         id:best.id,
         corners:canon,
         score:best.score
       });
     }

     srcTri.delete(); dstTri.delete(); M.delete();
     warp.delete(); wb.delete(); small.delete();
     approx.delete(); cnt.delete();
   }

   closed.delete(); contours.delete(); hierarchy.delete();
 }

 scanBinary(otsu);
 scanBinary(adaptive);

 src.delete(); gray.delete(); blur.delete();
 otsu.delete(); adaptive.delete(); kernel.delete();

 // Mantém primeiro os candidatos mais confiáveis e elimina duplicatas.
 candidates.sort((a,b)=>b.score-a.score);

 const spatial=[];
 for(const d of candidates){
   const c=centerOf(d.corners);
   if(spatial.every(k=>dist(c,centerOf(k.corners))>DEDUPE_DIST)){
     spatial.push(d);
   }
 }

 // No máximo uma detecção por face; fica a de maior confiança.
 const byId={};
 for(const d of spatial){
   if(!(d.id in byId) || d.score>byId[d.id].score) byId[d.id]=d;
 }

 return Object.values(byId);
}

async function solveBundle(ds,W,H){
 const obj=getOBJ();
 const good=ds.filter(d=>obj[d.id]&&d.corners&&d.corners.length===4);
 if(!good.length)return null;
 let op=[],ip=[];
 for(const d of good){ for(let i=0;i<4;i++){op.push(...obj[d.id][i]); ip.push(...pxy(d.corners[i]));} }
 const n=ip.length/2;
 const objectPoints=cv.matFromArray(n,1,cv.CV_64FC3,op);
 const imagePoints=cv.matFromArray(n,1,cv.CV_64FC2,ip);
 const fov=cameraFovDeg*Math.PI/180, fx=(W/2)/Math.tan(fov/2), fy=fx, cx=W/2, cy=H/2;
 const K=cv.matFromArray(3,3,cv.CV_64F,[fx,0,cx, 0,fy,cy, 0,0,1]);
 const dist=cv.Mat.zeros(4,1,cv.CV_64F),rvec=new cv.Mat(),tvec=new cv.Mat();
 let ok=false;
 try{ ok=cv.solvePnP(objectPoints,imagePoints,K,dist,rvec,tvec,false,cv.SOLVEPNP_ITERATIVE); }catch(e){ok=false}
 if(!ok){[objectPoints,imagePoints,K,dist,rvec,tvec].forEach(m=>m.delete());return null}
 const R=new cv.Mat(); cv.Rodrigues(rvec,R);
 const out={R:Array.from(R.data64F),t:Array.from(tvec.data64F),fx,fy,cx,cy,n,faces:good.map(x=>x.id),single:good.length===1};
 let err=0,count=0;
 for(const d of good){
   const pts=obj[d.id];
   for(let i=0;i<4;i++){
     const q=project3(pts[i],out); if(!q) continue;
     const [u,v]=pxy(d.corners[i]); const dx=q[0]-u,dy=q[1]-v; err += dx*dx+dy*dy; count++;
   }
 }
 out.reproj=count?Math.sqrt(err/count):999;
 [objectPoints,imagePoints,K,dist,rvec,tvec,R].forEach(m=>m.delete());
 const lim=out.single?MAX_REPROJ_SINGLE:MAX_REPROJ_MULTI;
 return out.reproj<=lim?out:null;
}
function matToQuat(m){
 const tr=m[0]+m[4]+m[8]; let x,y,z,w;
 if(tr>0){const s=Math.sqrt(tr+1.0)*2;w=.25*s;x=(m[7]-m[5])/s;y=(m[2]-m[6])/s;z=(m[3]-m[1])/s;}
 else if(m[0]>m[4]&&m[0]>m[8]){const s=Math.sqrt(1+m[0]-m[4]-m[8])*2;w=(m[7]-m[5])/s;x=.25*s;y=(m[1]+m[3])/s;z=(m[2]+m[6])/s;}
 else if(m[4]>m[8]){const s=Math.sqrt(1+m[4]-m[0]-m[8])*2;w=(m[2]-m[6])/s;x=(m[1]+m[3])/s;y=.25*s;z=(m[5]+m[7])/s;}
 else{const s=Math.sqrt(1+m[8]-m[0]-m[4])*2;w=(m[3]-m[1])/s;x=(m[2]+m[6])/s;y=(m[5]+m[7])/s;z=.25*s;}
 const n=Math.hypot(x,y,z,w)||1; return [x/n,y/n,z/n,w/n];
}
function quatToMat(q){
 const [x,y,z,w]=q,xx=x*x,yy=y*y,zz=z*z,xy=x*y,xz=x*z,yz=y*z,wx=w*x,wy=w*y,wz=w*z;
 return [1-2*(yy+zz),2*(xy-wz),2*(xz+wy),2*(xy+wz),1-2*(xx+zz),2*(yz-wx),2*(xz-wy),2*(yz+wx),1-2*(xx+yy)];
}
function slerp(a,b,t){
 let dot=a[0]*b[0]+a[1]*b[1]+a[2]*b[2]+a[3]*b[3], bb=b.slice();
 if(dot<0){dot=-dot; bb=bb.map(v=>-v)}
 if(dot>.9995){const q=a.map((v,i)=>v+t*(bb[i]-v)); const n=Math.hypot(...q)||1; return q.map(v=>v/n)}
 const th=Math.acos(Math.max(-1,Math.min(1,dot))),s=Math.sin(th);
 const u=Math.sin((1-t)*th)/s, v=Math.sin(t*th)/s; return a.map((x,i)=>u*x+v*bb[i]);
}
function poseDistance(a,b){return Math.hypot(a.t[0]-b.t[0],a.t[1]-b.t[1],a.t[2]-b.t[2]);}
function smoothPose(raw){
 const now=performance.now();

 if(!smoothedPose){
   smoothedPose={...raw,R:raw.R.slice(),t:raw.t.slice()};
   if(!raw.single){
     lastMultiPose={...smoothedPose,R:smoothedPose.R.slice(),t:smoothedPose.t.slice()};
     lastMultiPoseAt=now;
     strongAnchorUntil=now+700;
   }
   return smoothedPose;
 }

 if(raw.single && poseDistance(raw,smoothedPose)>MAX_SINGLE_JUMP_M) return smoothedPose;

 const pa=raw.single?POS_ALPHA_SINGLE:POS_ALPHA_MULTI;
 const ra=raw.single?ROT_ALPHA_SINGLE:ROT_ALPHA_MULTI;

 let targetT=raw.t.slice();

 // Quando houver só 1 face, confiamos mais na última pose multiface
 // para profundidade (Z) e parcialmente para X/Y.
 if(raw.single && lastMultiPose && (now-lastMultiPoseAt)<=MULTI_ANCHOR_MS){
   const freshStrong = now<strongAnchorUntil;
   const zBlend = freshStrong ? .98 : SINGLE_Z_BLEND;
   const xyBlend = freshStrong ? .80 : SINGLE_XY_BLEND;

   const az=lastMultiPose.t[2];
   const dz=clamp(targetT[2]-az,-SINGLE_Z_CLAMP,SINGLE_Z_CLAMP);
   const anchoredZ=az + dz*(1-zBlend);

   const ax=lastMultiPose.t[0], ay=lastMultiPose.t[1];
   const anchoredX=ax + (targetT[0]-ax)*(1-xyBlend);
   const anchoredY=ay + (targetT[1]-ay)*(1-xyBlend);

   targetT[0]=anchoredX;
   targetT[1]=anchoredY;
   targetT[2]=anchoredZ;
 }

 const t=smoothedPose.t.map((v,i)=>v+(targetT[i]-v)*pa);
 const q0=matToQuat(smoothedPose.R), q1=matToQuat(raw.R), q=slerp(q0,q1,ra);

 smoothedPose={...raw,t,R:quatToMat(q)};

 if(!raw.single){
   lastMultiPose={...smoothedPose,R:smoothedPose.R.slice(),t:smoothedPose.t.slice()};
   lastMultiPoseAt=now;
   strongAnchorUntil=now+700;
 }

 return smoothedPose;
}
function project3(P,pose){
 const [x,y,z]=P,R=pose.R,t=pose.t;
 const X=R[0]*x+R[1]*y+R[2]*z+t[0], Y=R[3]*x+R[4]*y+R[5]*z+t[1], Z=R[6]*x+R[7]*y+R[8]*z+t[2];
 if(Z<=.001) return null; return [pose.fx*X/Z+pose.cx, pose.fy*Y/Z+pose.cy];
}
function poseToThree(pose){
 const R=pose.R;
 const m=new THREE.Matrix4();
 m.set(
   R[0], -R[1], -R[2], 0,
   -R[3], R[4], R[5], 0,
   -R[6], R[7], R[8], 0,
   0,0,0,1
 );
 const q=new THREE.Quaternion().setFromRotationMatrix(m);
 const pos=new THREE.Vector3(pose.t[0], -pose.t[1], -pose.t[2]-0.004);
 return {pos, quat:q, single:!!pose.single, faces:pose.faces||[]};
}
function copyPoseState(st){
 return {pos:st.pos.clone(), quat:st.quat.clone(), single:st.single, faces:[...(st.faces||[])]};
}
function render(ds){
 const last=ds.filter(d=>d.id>=0&&d.id<=5);
 if(!last.length){facesEl.innerHTML='<span class="muted">Nenhuma face detectada.</span>'; return;}
 facesEl.innerHTML=last.length>=2 ? '<span class="ok">🌍 Terra 3D • rastreamento multiface</span><br><span class="muted">'+last.map(d=>N[d.id]).join(' + ')+'</span>' : '<span class="ok">🌍 Terra 3D • transição por 1 face</span><br><span class="muted">'+last.map(d=>N[d.id]).join(' + ')+'</span>';
}
function drawEarth(ds,sw,sh,pose){
 if(!threeReady) return;
 if(!pose){
   targetPose3d=null;
   return;
 }
 srcW=sw; srcH=sh;
 updateCameraIntrinsics();
 targetPose3d=poseToThree(pose);
}

function renderLoop(){
 if(threeReady){
   const t=performance.now()*0.001;
   earthMesh.rotation.y=t*.24;
   atmosphereMesh.rotation.y=t*.18;
   moonPivot.rotation.z=t*.34;
   moonPivot.rotation.y=t*.16;
   sunPivot.rotation.z=-t*.04;

   if(targetPose3d){
     if(!currentPose3d) currentPose3d=copyPoseState(targetPose3d);
     const pl=targetPose3d.single?TARGET_LERP_SINGLE:TARGET_LERP_MULTI;
     const rl=targetPose3d.single?ROT_LERP_SINGLE:ROT_LERP_MULTI;
     currentPose3d.pos.lerp(targetPose3d.pos,pl);
     currentPose3d.quat.slerp(targetPose3d.quat,rl);
     currentPose3d.single=targetPose3d.single;
     currentPose3d.faces=[...(targetPose3d.faces||[])];

     anchor3d.visible=true;
     anchor3d.position.copy(currentPose3d.pos);
     anchor3d.quaternion.copy(currentPose3d.quat);

     planetLabel.style.display='block';
     const P=new THREE.Vector3();
     anchor3d.getWorldPosition(P);
     P.project(cam3d);
     const sx=(P.x*.5+.5)*innerWidth, sy=(-P.y*.5+.5)*innerHeight;
     planetLabel.style.left=Math.max(12,Math.min(innerWidth-120,sx-40))+'px';
     planetLabel.style.top=Math.max(12,Math.min(innerHeight-46,sy+58))+'px';
   }else{
     anchor3d.visible=false;
     currentPose3d=null;
     planetLabel.style.display='none';
   }

   renderer3d.clear();
   renderer3d.render(scene3d,cam3d);
 }
 requestAnimationFrame(renderLoop);
}

async function loop(now){
 if(video.readyState>=2 && ready && !busy && (!loop.last || now-loop.last>=DETECT_INTERVAL_MS)){
  loop.last=now; busy=true;
  const W=560, H=Math.max(315,Math.round(W*video.videoHeight/video.videoWidth));
  work.width=W; work.height=H; srcW=W; srcH=H;
  const c=work.getContext('2d',{willReadFrequently:true}); c.drawImage(video,0,0,W,H);
  const imgData=c.getImageData(0,0,W,H);
  try{
    const ds=detectCustom(imgData,W,H);
    maybeCollectCalibration(ds,W,H);
    render(ds);
    const rawPose=ds.length?await solveBundle(ds,W,H):null;
    const now2=performance.now(); let pose=null;
    if(rawPose){ pose=smoothPose(rawPose); lastPose=pose; lastPoseAt=now2; }
    else if(lastPose && (now2-lastPoseAt)<=FALLBACK_MS){ pose=lastPose; }
    else if(!ds.length){ smoothedPose=null; lastDrawState=null; lastMultiDrawState=null; lastMultiPose=null; targetPose3d=null; }
    drawEarth(ds,W,H,pose);
    if(rawPose){
      statusEl.textContent=(rawPose.single?'Âncora 3D suave • 1 face':'Âncora 3D forte ✓ • '+rawPose.faces.map(id=>N[id]).join(' + '))+' • erro '+rawPose.reproj.toFixed(1)+'px';
    }else if(pose){
      statusEl.textContent='Ponte curta de rastreamento…';
    }else{
      statusEl.textContent=ds.length?'Face reconhecida • ajustando pose 3D…':'Câmera aberta • procurando o cubo…';
    }
  }catch(e){ console.error(e); statusEl.textContent='Detector: '+e.message; }
  busy=false;
 }
 requestAnimationFrame(loop);
}
