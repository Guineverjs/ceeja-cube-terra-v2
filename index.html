<script>
const N={0:"FRENTE",1:"DIREITA",2:"ATRÁS",3:"ESQUERDA",4:"TOPO",5:"BASE"};
const video=document.getElementById("video"), work=document.getElementById("work"),
overlay=document.getElementById("overlay"), statusEl=document.getElementById("status"),
facesEl=document.getElementById("faces"), start=document.getElementById("start");
let ready=false, busy=false, cvReady=false, cv=null;
let templates=[], lastPose=null, lastPoseAt=0, smoothedPose=null;
let lastMultiPose=null, lastMultiPoseAt=0, lastDrawState=null, lastMultiDrawState=null;
let strongAnchorUntil=0;

const FALLBACK_MS=320;
const POS_ALPHA_MULTI=.42, POS_ALPHA_SINGLE=.18;
const ROT_ALPHA_MULTI=.38, ROT_ALPHA_SINGLE=.16;
const MAX_SINGLE_JUMP_M=.055;
const MAX_REPROJ_MULTI=8.0, MAX_REPROJ_SINGLE=5.8;
const MULTI_ANCHOR_MS=2400;
const SINGLE_Z_CLAMP=.010;
const SINGLE_Z_BLEND=.88;
const SINGLE_XY_BLEND=.55;
const SINGLE_SCREEN_RADIUS_STEP=.045;
const SINGLE_SCREEN_CENTER_BLEND=.22;
const MULTI_SCREEN_RADIUS_BLEND=.28;
const MULTI_SCREEN_CENTER_BLEND=.34;
const SINGLE_RADIUS_FROM_MULTI_MIN=.90;
const SINGLE_RADIUS_FROM_MULTI_MAX=1.10;
const MAX_SINGLE_RADIUS_VIEWPORT=.42;
const MAX_MULTI_RADIUS_VIEWPORT=.48;
const HALF=.022;          // cube: 44 mm
const TAG_HALF=.01585;    // marker black square: 31.7 mm / 2
const EARTH_RADIUS=.050;  // 12 cm diameter virtual Earth
const TEMPLATE_SIZE=32;
const MIN_MATCH=0.67;
const MIN_AREA=850;
const MAX_AREA_FRAC=.34;
const DEDUPE_DIST=32;

function fit(){
 overlay.width=innerWidth*devicePixelRatio;overlay.height=innerHeight*devicePixelRatio;
 overlay.style.width=innerWidth+"px";overlay.style.height=innerHeight+"px";
}
addEventListener("resize",fit); fit();

async function waitForCV(){
 if(cvReady && cv) return true;

 statusEl.textContent="Câmera aberta ✓ • baixando motor de visão…";
 try{
   // Pacote moderno feito especificamente para uso do OpenCV.js no navegador.
   const mod = await import("https://esm.run/@opencvjs/web@5.0.0-release.2");
   statusEl.textContent="Câmera aberta ✓ • iniciando motor de visão…";
   cv = await mod.loadOpenCV();

   if(!cv || !cv.Mat || !cv.findContours || !cv.solvePnP){
     throw new Error("O motor carregou, mas faltam funções necessárias.");
   }

   cvReady=true;
   return true;
 }catch(e){
   console.error("OpenCV loader:",e);
   throw new Error("Não foi possível carregar o motor de visão: "+(e?.message||e));
 }
}
async function waitImgs(ids){
 await Promise.all(ids.map(id=>new Promise((resolve,reject)=>{
   const img=document.getElementById(id);
   if(img.complete && img.naturalWidth) return resolve();
   img.onload=()=>resolve(); img.onerror=()=>reject(new Error('Falha ao carregar '+id));
 })));
}
function matToBits(mat){
 const out=new Uint8Array(mat.rows*mat.cols);
 for(let i=0;i<out.length;i++) out[i]=mat.data[i]>127?1:0;
 return out;
}
function rotateBits(bits,size){
 const out=new Uint8Array(bits.length);
 for(let y=0;y<size;y++) for(let x=0;x<size;x++) out[y*size+x]=bits[(size-1-x)*size+y];
 return out;
}
function similarity(a,b){
 let same=0;
 for(let i=0;i<a.length;i++) if(a[i]===b[i]) same++;
 return same/a.length;
}
function rotateCorners(corners,rot){
 const n=corners.length, out=[];
 for(let i=0;i<n;i++) out.push(corners[(i+rot)%n]);
 return out;
}
function orderQuad(pts){
 const p=pts.slice().sort((a,b)=>a.y-b.y);
 const top=p.slice(0,2).sort((a,b)=>a.x-b.x);
 const bot=p.slice(2).sort((a,b)=>a.x-b.x);
 return [top[0],top[1],bot[1],bot[0]]; // tl,tr,br,bl
}
function quadArea(pts){
 let a=0; for(let i=0;i<4;i++){const p=pts[i], q=pts[(i+1)%4]; a += p.x*q.y - q.x*p.y;} return Math.abs(a/2);
}
function centerOf(c){return {x:(c[0].x+c[1].x+c[2].x+c[3].x)/4,y:(c[0].y+c[1].y+c[2].y+c[3].y)/4};}
function dist(a,b){const dx=a.x-b.x, dy=a.y-b.y; return Math.hypot(dx,dy)}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}

async function initDetector(){
 statusEl.textContent="Câmera aberta ✓ • preparando detector…";
 try{
   await waitForCV();
   statusEl.textContent="Motor de visão pronto ✓ • carregando marcadores…";
   await waitImgs(['tpl0','tpl1','tpl2','tpl3','tpl4','tpl5']);
   templates=[];
   for(let id=0; id<6; id++){
     const src=cv.imread(document.getElementById('tpl'+id));
     const gray=new cv.Mat(), bw=new cv.Mat(), small=new cv.Mat();
     cv.cvtColor(src,gray,cv.COLOR_RGBA2GRAY);
     cv.threshold(gray,bw,0,255,cv.THRESH_BINARY+cv.THRESH_OTSU);
     cv.resize(bw,small,new cv.Size(TEMPLATE_SIZE,TEMPLATE_SIZE),0,0,cv.INTER_AREA);
     const rots=[];
     let bits=matToBits(small);
     for(let r=0;r<4;r++){rots.push(bits); bits=rotateBits(bits,TEMPLATE_SIZE);}
     templates.push({id,rots});
     src.delete(); gray.delete(); bw.delete(); small.delete();
   }
   ready=true;
   statusEl.textContent="Detector CEEJA Cube pronto ✓";
   return true;
 }catch(e){
   ready=false;
   statusEl.textContent="Erro ao iniciar detector: "+e.message;
   console.error(e);
   throw e;
 }
}

start.onclick=async()=>{
 try{
  // 1) Abre a câmera primeiro. O motor de visão só começa depois do clique.
  start.disabled=true;
  start.textContent="ABRINDO CÂMERA…";
  const stream=await navigator.mediaDevices.getUserMedia({
    audio:false,
    video:{facingMode:{ideal:"environment"},width:{ideal:1280},height:{ideal:720}}
  });
  video.srcObject=stream;
  await video.play();

  start.style.display="none";
  statusEl.textContent="Câmera aberta ✓ • iniciando detector…";

  // 2) Só agora carrega/prepara o detector.
  if(!ready){
    await initDetector();
  }

  if(ready){
    statusEl.textContent="Detector pronto ✓ • procurando o cubo…";
  }
  requestAnimationFrame(loop);
 }catch(e){
  start.disabled=false;
  start.textContent="ABRIR CÂMERA";
  statusEl.textContent="Erro ao iniciar: "+e.message;
 }
};

function getOBJ(){
 const a=TAG_HALF;
 return {
  0:[[-a,-a, HALF],[ a,-a, HALF],[ a, a, HALF],[-a, a, HALF]],
  2:[[ a,-a,-HALF],[-a,-a,-HALF],[-a, a,-HALF],[ a, a,-HALF]],
  1:[[ HALF,-a, a],[ HALF,-a,-a],[ HALF, a,-a],[ HALF, a, a]],
  3:[[-HALF,-a,-a],[-HALF,-a, a],[-HALF, a, a],[-HALF, a,-a]],
  4:[[-a, HALF, a],[ a, HALF, a],[ a, HALF,-a],[-a, HALF,-a]],
  5:[[-a,-HALF,-a],[ a,-HALF,-a],[ a,-HALF, a],[-a,-HALF, a]]
 };
}
function pxy(p){return [p.x,p.y]}

function detectCustom(imageData,W,H){
 if(!cvReady || !templates.length) return [];

 const src=cv.matFromImageData(imageData);
 const gray=new cv.Mat(), blur=new cv.Mat();
 cv.cvtColor(src,gray,cv.COLOR_RGBA2GRAY);
 cv.GaussianBlur(gray,blur,new cv.Size(5,5),0,0,cv.BORDER_DEFAULT);

 // Duas leituras da mesma imagem:
 // 1) Otsu: ótima para contraste normal.
 // 2) Adaptativa: ajuda quando há sombra, inclinação ou iluminação desigual.
 const otsu=new cv.Mat(), adaptive=new cv.Mat();
 cv.threshold(blur,otsu,0,255,cv.THRESH_BINARY_INV+cv.THRESH_OTSU);
 cv.adaptiveThreshold(
   blur,adaptive,255,
   cv.ADAPTIVE_THRESH_GAUSSIAN_C,
   cv.THRESH_BINARY_INV,
   31,7
 );

 const kernel=cv.Mat.ones(3,3,cv.CV_8U);
 const binaries=[otsu,adaptive];
 const candidates=[];
 const maxArea=W*H*MAX_AREA_FRAC;

 function scanBinary(bin){
   const closed=new cv.Mat();
   cv.morphologyEx(bin,closed,cv.MORPH_CLOSE,kernel);

   const contours=new cv.MatVector(), hierarchy=new cv.Mat();
   // RETR_LIST encontra também quadriláteros que ficavam "escondidos"
   // dentro do contorno branco do cubo.
   cv.findContours(closed,contours,hierarchy,cv.RETR_LIST,cv.CHAIN_APPROX_SIMPLE);

   for(let i=0;i<contours.size();i++){
     const cnt=contours.get(i);
     const area=cv.contourArea(cnt);
     if(area<MIN_AREA || area>maxArea){cnt.delete(); continue;}

     const peri=cv.arcLength(cnt,true);
     const approx=new cv.Mat();
     cv.approxPolyDP(cnt,approx,0.04*peri,true);

     if(approx.rows!==4 || !cv.isContourConvex(approx)){
       approx.delete(); cnt.delete(); continue;
     }

     const pts=[];
     for(let j=0;j<4;j++){
       pts.push({x:approx.data32S[j*2], y:approx.data32S[j*2+1]});
     }
     const ord=orderQuad(pts);

     const sideLens=[];
     for(let j=0;j<4;j++){
       const a=ord[j], b=ord[(j+1)%4];
       sideLens.push(Math.hypot(a.x-b.x,a.y-b.y));
     }
     const minSide=Math.min(...sideLens), maxSide=Math.max(...sideLens);
     if(minSide<18 || maxSide/minSide>2.15){
       approx.delete(); cnt.delete(); continue;
     }

     const srcTri=cv.matFromArray(4,1,cv.CV_32FC2,[
       ord[0].x,ord[0].y,
       ord[1].x,ord[1].y,
       ord[2].x,ord[2].y,
       ord[3].x,ord[3].y
     ]);
     const dstTri=cv.matFromArray(4,1,cv.CV_32FC2,[0,0,79,0,79,79,0,79]);
     const M=cv.getPerspectiveTransform(srcTri,dstTri);

     const warp=new cv.Mat(), wb=new cv.Mat(), small=new cv.Mat();
     cv.warpPerspective(
       gray,warp,M,new cv.Size(80,80),
       cv.INTER_LINEAR,cv.BORDER_CONSTANT,
       new cv.Scalar(255,255,255,255)
     );

     // Um pequeno blur antes de binarizar torna a comparação menos sensível
     // a serrilhado, impressão e foco.
     cv.GaussianBlur(warp,warp,new cv.Size(3,3),0,0,cv.BORDER_DEFAULT);
     cv.threshold(warp,wb,0,255,cv.THRESH_BINARY+cv.THRESH_OTSU);
     cv.resize(wb,small,new cv.Size(TEMPLATE_SIZE,TEMPLATE_SIZE),0,0,cv.INTER_AREA);
     cv.threshold(small,small,127,255,cv.THRESH_BINARY);

     const bits=matToBits(small);
     let best={score:-1,id:-1,rot:0};

     for(const tpl of templates){
       for(let r=0;r<4;r++){
         const score=similarity(bits,tpl.rots[r]);
         if(score>best.score) best={score,id:tpl.id,rot:r};
       }
     }

     if(best.score>=MIN_MATCH){
       const canon=rotateCorners(ord,best.rot);
       candidates.push({
         id:best.id,
         corners:canon,
         score:best.score
       });
     }

     srcTri.delete(); dstTri.delete(); M.delete();
     warp.delete(); wb.delete(); small.delete();
     approx.delete(); cnt.delete();
   }

   closed.delete(); contours.delete(); hierarchy.delete();
 }

 scanBinary(otsu);
 scanBinary(adaptive);

 src.delete(); gray.delete(); blur.delete();
 otsu.delete(); adaptive.delete(); kernel.delete();

 // Mantém primeiro os candidatos mais confiáveis e elimina duplicatas.
 candidates.sort((a,b)=>b.score-a.score);

 const spatial=[];
 for(const d of candidates){
   const c=centerOf(d.corners);
   if(spatial.every(k=>dist(c,centerOf(k.corners))>DEDUPE_DIST)){
     spatial.push(d);
   }
 }

 // No máximo uma detecção por face; fica a de maior confiança.
 const byId={};
 for(const d of spatial){
   if(!(d.id in byId) || d.score>byId[d.id].score) byId[d.id]=d;
 }

 return Object.values(byId);
}

async function solveBundle(ds,W,H){
 const obj=getOBJ();
 const good=ds.filter(d=>obj[d.id]&&d.corners&&d.corners.length===4);
 if(!good.length)return null;
 let op=[],ip=[];
 for(const d of good){ for(let i=0;i<4;i++){op.push(...obj[d.id][i]); ip.push(...pxy(d.corners[i]));} }
 const n=ip.length/2;
 const objectPoints=cv.matFromArray(n,1,cv.CV_64FC3,op);
 const imagePoints=cv.matFromArray(n,1,cv.CV_64FC2,ip);
 const fov=45*Math.PI/180, fx=(W/2)/Math.tan(fov/2), fy=fx, cx=W/2, cy=H/2;
 const K=cv.matFromArray(3,3,cv.CV_64F,[fx,0,cx, 0,fy,cy, 0,0,1]);
 const dist=cv.Mat.zeros(4,1,cv.CV_64F),rvec=new cv.Mat(),tvec=new cv.Mat();
 let ok=false;
 try{ ok=cv.solvePnP(objectPoints,imagePoints,K,dist,rvec,tvec,false,cv.SOLVEPNP_ITERATIVE); }catch(e){ok=false}
 if(!ok){[objectPoints,imagePoints,K,dist,rvec,tvec].forEach(m=>m.delete());return null}
 const R=new cv.Mat(); cv.Rodrigues(rvec,R);
 const out={R:Array.from(R.data64F),t:Array.from(tvec.data64F),fx,fy,cx,cy,n,faces:good.map(x=>x.id),single:good.length===1};
 let err=0,count=0;
 for(const d of good){
   const pts=obj[d.id];
   for(let i=0;i<4;i++){
     const q=project3(pts[i],out); if(!q) continue;
     const [u,v]=pxy(d.corners[i]); const dx=q[0]-u,dy=q[1]-v; err += dx*dx+dy*dy; count++;
   }
 }
 out.reproj=count?Math.sqrt(err/count):999;
 [objectPoints,imagePoints,K,dist,rvec,tvec,R].forEach(m=>m.delete());
 const lim=out.single?MAX_REPROJ_SINGLE:MAX_REPROJ_MULTI;
 return out.reproj<=lim?out:null;
}
function matToQuat(m){
 const tr=m[0]+m[4]+m[8]; let x,y,z,w;
 if(tr>0){const s=Math.sqrt(tr+1.0)*2;w=.25*s;x=(m[7]-m[5])/s;y=(m[2]-m[6])/s;z=(m[3]-m[1])/s;}
 else if(m[0]>m[4]&&m[0]>m[8]){const s=Math.sqrt(1+m[0]-m[4]-m[8])*2;w=(m[7]-m[5])/s;x=.25*s;y=(m[1]+m[3])/s;z=(m[2]+m[6])/s;}
 else if(m[4]>m[8]){const s=Math.sqrt(1+m[4]-m[0]-m[8])*2;w=(m[2]-m[6])/s;x=(m[1]+m[3])/s;y=.25*s;z=(m[5]+m[7])/s;}
 else{const s=Math.sqrt(1+m[8]-m[0]-m[4])*2;w=(m[3]-m[1])/s;x=(m[2]+m[6])/s;y=(m[5]+m[7])/s;z=.25*s;}
 const n=Math.hypot(x,y,z,w)||1; return [x/n,y/n,z/n,w/n];
}
function quatToMat(q){
 const [x,y,z,w]=q,xx=x*x,yy=y*y,zz=z*z,xy=x*y,xz=x*z,yz=y*z,wx=w*x,wy=w*y,wz=w*z;
 return [1-2*(yy+zz),2*(xy-wz),2*(xz+wy),2*(xy+wz),1-2*(xx+zz),2*(yz-wx),2*(xz-wy),2*(yz+wx),1-2*(xx+yy)];
}
function slerp(a,b,t){
 let dot=a[0]*b[0]+a[1]*b[1]+a[2]*b[2]+a[3]*b[3], bb=b.slice();
 if(dot<0){dot=-dot; bb=bb.map(v=>-v)}
 if(dot>.9995){const q=a.map((v,i)=>v+t*(bb[i]-v)); const n=Math.hypot(...q)||1; return q.map(v=>v/n)}
 const th=Math.acos(Math.max(-1,Math.min(1,dot))),s=Math.sin(th);
 const u=Math.sin((1-t)*th)/s, v=Math.sin(t*th)/s; return a.map((x,i)=>u*x+v*bb[i]);
}
function poseDistance(a,b){return Math.hypot(a.t[0]-b.t[0],a.t[1]-b.t[1],a.t[2]-b.t[2]);}
function smoothPose(raw){
 const now=performance.now();

 if(!smoothedPose){
   smoothedPose={...raw,R:raw.R.slice(),t:raw.t.slice()};
   if(!raw.single){
     lastMultiPose={...smoothedPose,R:smoothedPose.R.slice(),t:smoothedPose.t.slice()};
     lastMultiPoseAt=now;
     strongAnchorUntil=now+700;
   }
   return smoothedPose;
 }

 if(raw.single && poseDistance(raw,smoothedPose)>MAX_SINGLE_JUMP_M) return smoothedPose;

 const pa=raw.single?POS_ALPHA_SINGLE:POS_ALPHA_MULTI;
 const ra=raw.single?ROT_ALPHA_SINGLE:ROT_ALPHA_MULTI;

 let targetT=raw.t.slice();

 // Quando houver só 1 face, confiamos mais na última pose multiface
 // para profundidade (Z) e parcialmente para X/Y.
 if(raw.single && lastMultiPose && (now-lastMultiPoseAt)<=MULTI_ANCHOR_MS){
   const freshStrong = now<strongAnchorUntil;
   const zBlend = freshStrong ? .95 : SINGLE_Z_BLEND;
   const xyBlend = freshStrong ? .72 : SINGLE_XY_BLEND;

   const az=lastMultiPose.t[2];
   const dz=clamp(targetT[2]-az,-SINGLE_Z_CLAMP,SINGLE_Z_CLAMP);
   const anchoredZ=az + dz*(1-zBlend);

   const ax=lastMultiPose.t[0], ay=lastMultiPose.t[1];
   const anchoredX=ax + (targetT[0]-ax)*(1-xyBlend);
   const anchoredY=ay + (targetT[1]-ay)*(1-xyBlend);

   targetT[0]=anchoredX;
   targetT[1]=anchoredY;
   targetT[2]=anchoredZ;
 }

 const t=smoothedPose.t.map((v,i)=>v+(targetT[i]-v)*pa);
 const q0=matToQuat(smoothedPose.R), q1=matToQuat(raw.R), q=slerp(q0,q1,ra);

 smoothedPose={...raw,t,R:quatToMat(q)};

 if(!raw.single){
   lastMultiPose={...smoothedPose,R:smoothedPose.R.slice(),t:smoothedPose.t.slice()};
   lastMultiPoseAt=now;
   strongAnchorUntil=now+700;
 }

 return smoothedPose;
}
function project3(P,pose){
 const [x,y,z]=P,R=pose.R,t=pose.t;
 const X=R[0]*x+R[1]*y+R[2]*z+t[0], Y=R[3]*x+R[4]*y+R[5]*z+t[1], Z=R[6]*x+R[7]*y+R[8]*z+t[2];
 if(Z<=.001) return null; return [pose.fx*X/Z+pose.cx, pose.fy*Y/Z+pose.cy];
}
function render(ds){
 const last=ds.filter(d=>d.id>=0&&d.id<=5);
 if(!last.length){facesEl.innerHTML='<span class="muted">Nenhuma face detectada.</span>'; return;}
 facesEl.innerHTML=last.length>=2 ? '<span class="ok">🌍 Rastreamento multiface</span><br><span class="muted">'+last.map(d=>N[d.id]).join(' + ')+'</span>' : '<span class="ok">🌍 Transição por 1 face</span><br><span class="muted">'+last.map(d=>N[d.id]).join(' + ')+'</span>';
}
function drawEarth(ds,sw,sh,pose){
 const ctx=overlay.getContext('2d');
 ctx.clearRect(0,0,overlay.width,overlay.height);

 if(!pose){
   lastDrawState=null;
   return;
 }

 const vw=innerWidth,vh=innerHeight,scale=Math.max(vw/sw,vh/sh);
 const ox=(vw-sw*scale)/2, oy=(vh-sh*scale)/2, dp=devicePixelRatio;
 const S=p=>[ox+p[0]*scale, oy+p[1]*scale];
 const C3=[0,0,0], RADIUS=EARTH_RADIUS;

 const cp=project3(C3,pose), xp=project3([RADIUS,0,0],pose), yp=project3([0,RADIUS,0],pose);
 if(!cp||!xp||!yp)return;

 let C=S(cp), X=S(xp), Y=S(yp);
 let rad=(Math.hypot(X[0]-C[0],X[1]-C[1])+Math.hypot(Y[0]-C[0],Y[1]-C[1]))/2;

 // Rejeita tamanhos fisicamente absurdos antes de desenhar.
 const maxViewportRad=Math.min(vw,vh)*(pose.single?MAX_SINGLE_RADIUS_VIEWPORT:MAX_MULTI_RADIUS_VIEWPORT);
 if(!Number.isFinite(rad) || rad<8 || rad>maxViewportRad){
   if(lastDrawState){
     C=[lastDrawState.cx,lastDrawState.cy];
     rad=lastDrawState.rad;
   }else{
     return;
   }
 }

 const now=performance.now();

 // Multiface vira uma "régua" confiável de escala.
 if(!pose.single){
   if(lastDrawState){
     rad=lastDrawState.rad + (rad-lastDrawState.rad)*MULTI_SCREEN_RADIUS_BLEND;
     C=[
       lastDrawState.cx + (C[0]-lastDrawState.cx)*MULTI_SCREEN_CENTER_BLEND,
       lastDrawState.cy + (C[1]-lastDrawState.cy)*MULTI_SCREEN_CENTER_BLEND
     ];
   }
   lastMultiDrawState={cx:C[0],cy:C[1],rad,at:now};
 }else{
   // Com uma face só, trava a escala perto da última escala multiface.
   if(lastMultiDrawState && (now-lastMultiDrawState.at)<=MULTI_ANCHOR_MS){
     const minR=lastMultiDrawState.rad*SINGLE_RADIUS_FROM_MULTI_MIN;
     const maxR=lastMultiDrawState.rad*SINGLE_RADIUS_FROM_MULTI_MAX;
     rad=clamp(rad,minR,maxR);
   }else if(lastDrawState){
     const minR=lastDrawState.rad*(1-SINGLE_SCREEN_RADIUS_STEP);
     const maxR=lastDrawState.rad*(1+SINGLE_SCREEN_RADIUS_STEP);
     rad=clamp(rad,minR,maxR);
   }

   if(lastDrawState){
     C=[
       lastDrawState.cx + (C[0]-lastDrawState.cx)*SINGLE_SCREEN_CENTER_BLEND,
       lastDrawState.cy + (C[1]-lastDrawState.cy)*SINGLE_SCREEN_CENTER_BLEND
     ];
   }
 }

 lastDrawState={cx:C[0],cy:C[1],rad,single:pose.single,at:now};

 ctx.save();
 ctx.scale(dp,dp);
 ctx.shadowColor='rgba(70,190,255,.72)';
 ctx.shadowBlur=20;
 ctx.fillStyle='#0a4c88';
 ctx.beginPath();
 ctx.arc(C[0],C[1],rad,0,Math.PI*2);
 ctx.fill();
 ctx.shadowBlur=0;

 const tex=document.getElementById('earthTexture');
 ctx.save();
 ctx.beginPath();
 ctx.arc(C[0],C[1],rad*.985,0,Math.PI*2);
 ctx.clip();

 if(tex && tex.complete && tex.naturalWidth){
   const tw=tex.naturalWidth, th=tex.naturalHeight, spin=((performance.now()/28000)%1), sx=spin*tw, d=rad*2;
   ctx.drawImage(tex,sx,0,tw-sx,th,C[0]-rad,C[1]-rad,d*(tw-sx)/tw,d);
   if(sx>0) ctx.drawImage(tex,0,0,sx,th,C[0]-rad+d*(tw-sx)/tw,C[1]-rad,d*sx/tw,d);
 } else {
   const g=ctx.createRadialGradient(C[0]-rad*.3,C[1]-rad*.3,rad*.1,C[0],C[1],rad);
   g.addColorStop(0,'#4da7dd');
   g.addColorStop(1,'#062d5b');
   ctx.fillStyle=g;
   ctx.fillRect(C[0]-rad,C[1]-rad,rad*2,rad*2);
 }

 const shade=ctx.createRadialGradient(C[0]-rad*.34,C[1]-rad*.30,rad*.12,C[0]+rad*.20,C[1]+rad*.12,rad*1.05);
 shade.addColorStop(0,'rgba(255,255,255,.20)');
 shade.addColorStop(.55,'rgba(255,255,255,0)');
 shade.addColorStop(1,'rgba(0,12,32,.48)');
 ctx.fillStyle=shade;
 ctx.fillRect(C[0]-rad,C[1]-rad,rad*2,rad*2);
 ctx.restore();

 ctx.strokeStyle='rgba(174,232,255,.90)';
 ctx.lineWidth=2.5;
 ctx.beginPath();
 ctx.arc(C[0],C[1],rad,0,Math.PI*2);
 ctx.stroke();
 ctx.restore();
}
async function loop(){
 if(video.readyState>=2 && ready && !busy){
  busy=true;
  const W=560, H=Math.max(315,Math.round(W*video.videoHeight/video.videoWidth));
  work.width=W; work.height=H;
  const c=work.getContext('2d',{willReadFrequently:true}); c.drawImage(video,0,0,W,H);
  const imgData=c.getImageData(0,0,W,H);
  try{
    const ds=detectCustom(imgData,W,H);
    render(ds);
    const rawPose=ds.length?await solveBundle(ds,W,H):null;
    const now=performance.now(); let pose=null;
    if(rawPose){ pose=smoothPose(rawPose); lastPose=pose; lastPoseAt=now; }
    else if(lastPose && (now-lastPoseAt)<=FALLBACK_MS){ pose=lastPose; }
    else if(!ds.length){ smoothedPose=null; lastDrawState=null; lastMultiDrawState=null; lastMultiPose=null; }
    drawEarth(ds,W,H,pose);
    if(rawPose){
      statusEl.textContent=(rawPose.single?'Âncora suave • 1 face':'Âncora forte ✓ • '+rawPose.faces.map(id=>N[id]).join(' + '))+' • erro '+rawPose.reproj.toFixed(1)+'px';
    }else if(pose){
      statusEl.textContent='Ponte curta de rastreamento…';
    }else{
      statusEl.textContent=ds.length?'Face reconhecida • ajustando pose…':'Câmera aberta • procurando o cubo…';
    }
  }catch(e){ console.error(e); statusEl.textContent='Detector: '+e.message; }
  busy=false;
 }
 requestAnimationFrame(loop);
}
</script>
